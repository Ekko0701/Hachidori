# Builds, signs, notarizes and drafts a GitHub Release when a v* tag is pushed.
# Repository secrets it needs are listed in docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # The runner context is not available in job-level env, so steps share the path this way.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm "$RUNNER_TEMP/developer-id.p12"

      # Individual developer accounts cannot create App Store Connect API keys,
      # so notarization signs in with the Apple ID and an app-specific password.
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials hachidori-notary \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --keychain "$KEYCHAIN"

      - name: Test
        run: swift test

      - name: Package
        env:
          NOTARY_PROFILE: hachidori-notary
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          [[ "$version" == 0.* ]] && prerelease=(--prerelease)   # 0.x is beta
          gh release create "$GITHUB_REF_NAME" dist/Hachidori-*.dmg dist/Hachidori-*.dmg.sha256 \
            --title "Hachidori $version" --generate-notes --draft "${prerelease[@]}"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
